name: Ephemeral Environment Pipeline

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment name for the ephemeral lab"
        required: true
        default: "dev"
      vpc_id:
        description: "Existing AWS VPC ID to use for deployment"
        required: true
      subnet_id:
        description: "AWS Subnet ID to validate against"
        required: true
      override_required_ips:
        description: "Optional simulation override for required private IP count"
        required: false
        default: ""
      override_available_ips:
        description: "Optional simulation override for available private IP count"
        required: false
        default: ""

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_STATE_KEY: ephemeral/${{ github.event.inputs.env_name }}/terraform.tfstate
      ENV_NAME: ${{ github.event.inputs.env_name }}
      VPC_ID: ${{ github.event.inputs.vpc_id }}
      SUBNET_ID: ${{ github.event.inputs.subnet_id }}
      OVERRIDE_REQUIRED_IPS: ${{ github.event.inputs.override_required_ips }}
      OVERRIDE_AVAILABLE_IPS: ${{ github.event.inputs.override_available_ips }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform init
        working-directory: terraform
        run: |
          # The S3 state bucket must exist before initialization.
          terraform init -backend-config="key=${TF_STATE_KEY}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="environment_name=${ENV_NAME}" \
            -var="vpc_id=${VPC_ID}" \
            -var="subnet_id=${SUBNET_ID}" \
            -out=tfplan

      - name: Generate Terraform plan JSON
        working-directory: terraform
        run: |
          # Use the shell redirect on Linux runners so the output is written as emitted (UTF-8)
          terraform show -json tfplan > tfplan.json

      - name: Validate subnet IP availability
        run: |
          EXTRA_ARGS=""
          if [ -n "${OVERRIDE_REQUIRED_IPS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --override-required-ips=${OVERRIDE_REQUIRED_IPS}"
          fi
          if [ -n "${OVERRIDE_AVAILABLE_IPS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --override-available-ips=${OVERRIDE_AVAILABLE_IPS}"
          fi
          python ./python/scripts/validate_subnet_ips.py ./terraform/tfplan.json "${SUBNET_ID}" $EXTRA_ARGS

      - name: Terraform apply
        if: success()
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan
